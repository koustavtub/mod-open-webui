name: Publish Helm Chart to GHCR (OCI)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package chart
        id: package
        run: |
          mkdir -p dist
          helm dependency update ./helm
          CHART_NAME="$(helm show chart ./helm | awk '/^name:/ {print $2; exit}')"
          CHART_VERSION="$(helm show chart ./helm | awk '/^version:/ {print $2; exit}')"
          helm package ./helm --destination dist
          echo "chart_name=${CHART_NAME}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push chart to GHCR OCI registry
        env:
          OWNER_LC: ${{ github.repository_owner }}
        run: |
          OWNER_LC="$(echo "$OWNER_LC" | tr '[:upper:]' '[:lower:]')"
          helm push "dist/${{ steps.package.outputs.chart_name }}-${{ steps.package.outputs.chart_version }}.tgz" \
            "oci://ghcr.io/${OWNER_LC}/charts"

      - name: Show pull command
        env:
          OWNER_LC: ${{ github.repository_owner }}
        run: |
          OWNER_LC="$(echo "$OWNER_LC" | tr '[:upper:]' '[:lower:]')"
          echo "Published:"
          echo "oci://ghcr.io/${OWNER_LC}/charts/${{ steps.package.outputs.chart_name }}:${{ steps.package.outputs.chart_version }}"